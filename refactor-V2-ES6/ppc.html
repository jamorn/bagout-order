<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPC - Under Construction</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<!-- Header / Navbar -->
<header class="header-gradient shadow-lg sticky top-0 z-50">
    <div class="container mx-auto px-4 py-4">
        <div class="flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fas fa-industry text-yellow-400 text-2xl"></i>
                <h1 class="text-xl md:text-2xl font-bold header-text">BAGOUT ORDER</h1>
                <span class="hidden sm:inline-block px-2 py-1 nav-bg-active rounded text-xs header-text">Production System</span>
            </div>
            
            <!-- Navigation Units -->
            <nav class="flex items-center gap-2">
                <a href="index.html" class="nav-unit px-4 py-2 rounded-lg header-text-muted font-medium transition nav-bg-hover">
                    <i class="fas fa-cube mr-2"></i>PP
                </a>
                <a href="hdpe.html" class="nav-unit px-4 py-2 rounded-lg header-text-muted font-medium transition nav-bg-hover">
                    <i class="fas fa-oil-can mr-2"></i>HDPE
                </a>
                <a href="ppc.html" class="nav-unit active px-4 py-2 rounded-lg nav-bg-active header-text font-semibold transition nav-bg-hover">
                    <i class="fas fa-layer-group mr-2"></i>PPC
                </a>
                <a href="bagging.html" class="nav-unit px-4 py-2 rounded-lg header-text-muted font-medium transition nav-bg-hover">
                    <i class="fas fa-boxes mr-2"></i>Bagging
                </a>
            </nav>
            
            <div class="flex items-center gap-4">
                <label for="themeSelect" class="text-sm header-text-muted hidden sm:inline">Theme</label>
                <select id="themeSelect" class="theme-select-bg rounded px-2 py-1 text-sm">
                    <option value="purple">Purple (default)</option>
                    <option value="emerald">Emerald</option>
                </select>
                <span class="text-sm header-text-muted">Production Management System</span>
            </div>
        </div>
    </div>
</header>

<main class="container mx-auto px-4 py-8">
    <section class="bg-white/5 backdrop-blur-sm rounded-2xl p-6 shadow-2xl border border-white/10 text-center">
        <h2 class="text-2xl font-bold mb-4">PPC - Under Construction</h2>
        <p class="text-purple-200 mb-4">หน้านี้กำลังอยู่ในช่วงพัฒนา — จะกลับมาพร้อมฟีเจอร์การจัดการ Bagout สำหรับ PPC เร็วๆ นี้</p>
        <a href="index.html" class="btn btn-primary">กลับไปยังหน้า PP</a>
    </section>
</main>

<!-- Theme Management -->
<script type="module">
    import { initTheme } from './js/theme.js';
    initTheme();
</script>

</body>
</html>
