<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bagging Queue - BAGOUT ORDER (ES6)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<!-- Header / Navbar (same as index) -->
<header class="header-gradient shadow-lg sticky top-0 z-50">
    <div class="container mx-auto px-4 py-4">
        <div class="flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fas fa-industry text-yellow-400 text-2xl"></i>
                <h1 class="text-xl md:text-2xl font-bold header-text">BAGOUT ORDER</h1>
                <span class="hidden sm:inline-block px-2 py-1 nav-bg-active rounded text-xs header-text">Production System</span>
            </div>
            
            <!-- Navigation Units -->
            <nav class="flex items-center gap-2">
                <a href="index.html" class="nav-unit px-4 py-2 rounded-lg header-text-muted font-medium transition nav-bg-hover">
                    <i class="fas fa-cube mr-2"></i>PP
                </a>
                <a href="hdpe.html" class="nav-unit px-4 py-2 rounded-lg header-text-muted font-medium transition nav-bg-hover">
                    <i class="fas fa-oil-can mr-2"></i>HDPE
                </a>
                <a href="ppc.html" class="nav-unit px-4 py-2 rounded-lg header-text-muted font-medium transition nav-bg-hover">
                    <i class="fas fa-layer-group mr-2"></i>PPC
                </a>
                <a href="bagging.html" class="nav-unit active px-4 py-2 rounded-lg nav-bg-active header-text font-semibold transition nav-bg-hover">
                    <i class="fas fa-boxes mr-2"></i>Bagging
                </a>
            </nav>
            
            <div class="flex items-center gap-4">
                <label for="themeSelect" class="text-sm header-text-muted hidden sm:inline">Theme</label>
                <select id="themeSelect" class="theme-select-bg rounded px-2 py-1 text-sm">
                    <option value="purple">Purple (default)</option>
                    <option value="emerald">Emerald</option>
                </select>
                <span class="text-sm header-text-muted">Production Management System</span>
            </div>
        </div>
    </div>
</header>
<main class="container mx-auto px-4 py-8">
    <section class="bg-white/5 backdrop-blur-sm rounded-2xl p-6 shadow-2xl border border-white/10">
        <h2 class="text-2xl font-bold mb-6 flex items-center gap-2"><i class="fas fa-boxes text-purple-400"></i>Bagging Queue</h2>
        <div id="bagging-history-table"></div>
    </section>
</main>

<!-- Receive Modal (simple) -->
<div id="receiveModal" class="fixed inset-0 hidden items-center justify-center bg-black/50 z-50">
    <div class="bg-white rounded-lg w-96 p-4 text-gray-900">
        <h3 class="font-bold text-lg mb-2">Confirm Receive</h3>
        <div id="receiveModalBody" class="text-sm text-gray-700 mb-4">Loading...</div>
        <div class="mb-4">
            <label class="block text-sm font-medium mb-1">Receiver</label>
            <input id="receiveName" class="w-full border rounded px-3 py-2" placeholder="ชื่อผู้รับ" />
        </div>
        <div class="flex justify-end gap-2">
            <button id="receiveCancel" class="px-4 py-2 rounded bg-gray-300">Cancel</button>
            <button id="receiveConfirm" class="px-4 py-2 rounded bg-indigo-600 text-white">Confirm</button>
        </div>
    </div>
</div>

<script type="module">
import { initHistoryTable, renderBaggingTable, confirmReceive } from './js/historyTable.js';

    document.addEventListener('DOMContentLoaded', () => {
    // initialize history storage and render into bagging container
    initHistoryTable('bagging-history-table');
    renderBaggingTable(1, 'bagging-history-table');

    // Modal helpers
    let _currentReceiveIdx = null;
    window.openReceiveModal = (idx) => {
        const data = JSON.parse(localStorage.getItem('bagoutOrderHistory')) || [];
        const row = data[idx];
        if (!row) return;
        _currentReceiveIdx = idx;
        const body = document.getElementById('receiveModalBody');
        body.innerHTML = `PO: <strong>${row.orderPO}</strong><br/>Silo: <strong>${row.bagSilo}</strong><br/>Qty: <strong>${row.quantity}</strong>`;
        const nameInput = document.getElementById('receiveName');
        nameInput.value = row.receiveBy || '';
        document.getElementById('receiveModal').style.display = 'flex';
    };

    document.getElementById('receiveCancel').addEventListener('click', () => {
        document.getElementById('receiveModal').style.display = 'none';
        _currentReceiveIdx = null;
    });
    document.getElementById('receiveConfirm').addEventListener('click', () => {
        const name = document.getElementById('receiveName').value.trim() || 'Receiver';
        if (_currentReceiveIdx === null) return;
        confirmReceive(_currentReceiveIdx, name);
        document.getElementById('receiveModal').style.display = 'none';
        _currentReceiveIdx = null;
        if (window.showToast) window.showToast('รับของสำเร็จ');
    });
});
</script>

<!-- Theme Management -->
<script type="module">
    import { initTheme } from './js/theme.js';
    initTheme();
</script>

</body>
</html>
